name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build docs
        run: |
          cargo doc --no-deps \
            --config rustdoc.base_url="https://coderman73.github.io/fabric-writer/"

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc/fabric_writer
      - name: Set up GitHub Pages source
        if: github.ref == 'refs/heads/main'
        run: echo "Docs deployed to https://coderman73.github.io/fabric-writer/"
