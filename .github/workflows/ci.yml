name: CI

on:
  push:
    branches: [ main, 'feature/*', 'bugfix/*', 'hotfix/*' ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache test fixtures
        uses: actions/cache@v4
        with:
          path: .testing-cache/
          key: testing-cache-${{ runner.os }}-${{ hashFiles('tests/tests.rs') }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -W rustdoc::all -W missing_docs

      - name: Doc
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D rustdoc::all -D missing-docs"

      - name: Test (non-ignored)
        run: cargo test

      - name: Test (ignored — requires Deno + JDK 25)
        if: ${{ runner.os == 'ubuntu-latest' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/bugfix/') || startsWith(github.ref, 'refs/heads/hotfix/')) }}
        run: |
          echo "FABRIC_WRITER_TEST_JAVA=$(echo $HOME/.cargo/env 2>/dev/null && which java 2>/dev/null || echo 'not found')"
          if ! command -v deno &>/dev/null || [ ! -x "$(command -v java 2>/dev/null || echo /nonexistent)" ]; then
            echo "Deno or Java not available — skipping ignored tests"
            exit 0
          fi
          cp .env.example .env
          cargo test -- --ignored
        env:
          PATH: ${{ env.HOME }}/.deno/bin:${{ env.HOME }}/.cargo/bin:${{ env.PATH }}

      - name: Build
        run: cargo build

      - name: Verify COMMANDS.md is up to date
        shell: bash
        run: |
          cargo run --bin fabric-writer -- --markdown-help > /tmp/COMMANDS.md.check
          diff -u COMMANDS.md /tmp/COMMANDS.md.check || (echo "::error::COMMANDS.md is out of date. Run 'make docs' and commit." && exit 1)
