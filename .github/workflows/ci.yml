name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -W rustdoc::all -W missing_docs

      - name: Doc
        run: RUSTDOCFLAGS="-D rustdoc::all -D missing-docs" cargo doc --no-deps

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build
